name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install build and test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run public tests
        # Tests needing undistributed game fixtures skip when fixtures are absent.
        run: python -m unittest discover -v

      - name: Check source runtime
        run: |
          python portable_hud.py --self-check source-self-check.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Get-Content -LiteralPath source-self-check.json -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.lzo_roundtrip -or -not $result.tkinter -or -not $result.v4_downed_offscreen_condition -or $result.v5_full_hud_targets -ne 516 -or $result.custom_checkboxes -ne 8) {
            throw "Source runtime self-check failed."
          }

      - name: Build portable executable
        run: python build_portable.py --format exe --output dist_ci

      - name: Check bundled runtime
        run: |
          $executable = Join-Path $PWD 'dist_ci\WildlandsHUD\WildlandsHUD.exe'
          $report = Join-Path $PWD 'frozen-self-check.json'
          $process = Start-Process -FilePath $executable -ArgumentList @('--self-check', ('"' + $report + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Executable self-check exited with code $($process.ExitCode)." }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.frozen -or -not $result.lzo_roundtrip -or -not $result.tkinter -or -not $result.v4_downed_offscreen_condition -or $result.v5_full_hud_targets -ne 516 -or $result.custom_checkboxes -ne 8) {
            throw "Bundled runtime self-check failed."
          }
